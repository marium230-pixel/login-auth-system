<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Vault Auth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
  <div class="vault-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>
    Vault Auth · OIBSIP Web Dev L2
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Log in with your registered email and password.</p>

  <div class="error-banner" id="error-banner"></div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
    </div>

    <button type="submit" id="submit-btn">Log In</button>
  </form>

  <div class="switch-link">No key yet? <a href="/register.html">Create an account</a></div>
</div>

<script>
(function () {
  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorBanner = document.getElementById('error-banner');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.remove('visible');

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showError('Please fill in both fields.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        // Deliberately generic — matches server's generic error, never reveals which field was wrong
        showError(data.error || 'Incorrect email or password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
        return;
      }

      window.location.href = '/dashboard';
    } catch (err) {
      showError('Could not reach the server. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
})();
</script>

</body>
</html>

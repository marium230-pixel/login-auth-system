<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Vault Auth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
  <div class="vault-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="3" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="21" y2="12"/></svg>
    Vault Auth · OIBSIP Web Dev L2
  </div>

  <h1>Create your account</h1>
  <p class="subtitle">Register to get a key to the vault.</p>

  <div class="error-banner" id="error-banner"></div>
  <div class="success-banner" id="success-banner"></div>

  <form id="register-form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters, 1 number" required autocomplete="new-password">
      <div class="field-hint">Minimum 8 characters, must include at least 1 number.</div>
    </div>

    <button type="submit" id="submit-btn">Register</button>
  </form>

  <div class="switch-link">Already have a key? <a href="/login.html">Log in</a></div>
</div>

<script>
(function () {
  const form = document.getElementById('register-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorBanner = document.getElementById('error-banner');
  const successBanner = document.getElementById('success-banner');
  const submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add('visible');
    successBanner.classList.remove('visible');
  }

  function clearBanners() {
    errorBanner.classList.remove('visible');
    successBanner.classList.remove('visible');
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function isValidPassword(pw) {
    return pw.length >= 8 && /\d/.test(pw);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanners();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showError('Please fill in both fields.');
      return;
    }
    if (!isValidEmail(email)) {
      showError('Please enter a valid email address.');
      return;
    }
    if (!isValidPassword(password)) {
      showError('Password must be at least 8 characters and include at least 1 number.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Something went wrong.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register';
        return;
      }

      successBanner.textContent = 'Account created. Redirecting…';
      successBanner.classList.add('visible');
      setTimeout(() => { window.location.href = '/dashboard'; }, 700);
    } catch (err) {
      showError('Could not reach the server. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Register';
    }
  });
})();
</script>

</body>
</html>
